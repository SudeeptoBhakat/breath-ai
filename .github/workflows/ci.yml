name: CI — Build & Type-Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    name: TypeScript + Vite Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
        env:
          # Provide dummy env vars so the build doesn't throw on missing keys
          VITE_WAQI_TOKEN: ${{ secrets.VITE_WAQI_TOKEN || 'ci_placeholder' }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY || 'ci_placeholder' }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY || 'ci_placeholder' }}
          GROQ_LLM_API_KEY: ${{ secrets.GROQ_LLM_API_KEY || 'ci_placeholder' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'ci_placeholder' }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
