name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for filing a bug report. Please fill in as much detail as possible.

  - type: input
    id: version
    attributes:
      label: App Version / Commit
      placeholder: "e.g. v1.4.0 or commit abc1234"
    validations:
      required: false

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile Chrome (Android)
        - Mobile Safari (iOS)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open the app
        2. Click "Share Report"
        3. See blank screen
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console Errors
      description: Open DevTools → Console. Paste any red error messages here.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Screenshots, screen recordings, or anything else useful.
