name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you thought about?

  - type: dropdown
    id: area
    attributes:
      label: Feature Area
      options:
        - AI Assistant (BreatheAI Chat)
        - Dashboard / AQI Card
        - Map
        - Health Advisory
        - Analytics / Forecasting
        - Social Sharing
        - Multilingual (i18n)
        - Alerts
        - Performance / Build
        - Other
