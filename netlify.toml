[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://air-quality-api.open-meteo.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.waqi.info https://tiles.aqicn.org https://nominatim.openstreetmap.org https://generativelanguage.googleapis.com https://api.groq.com https://ollama.com https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob: https://images.unsplash.com https://tiles.aqicn.org https://*.tile.openstreetmap.org https://i.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; worker-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none';"

[[redirects]]
  from = "/api/breathe-ai"
  to = "/.netlify/functions/breathe-ai"
  status = 200

[[redirects]]
  from = "/api/send-alert-email"
  to = "/.netlify/functions/send-alert-email"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
