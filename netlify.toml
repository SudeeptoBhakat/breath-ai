[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[[redirects]]
  from = "/api/breathe-ai"
  to = "/.netlify/functions/breathe-ai"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
